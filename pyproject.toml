[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitlore"
version = "0.1.0"
description = "Visualize your codebase's story from git history — churn, complexity hotspots, contributors, and timeline. Zero config."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GitLore contributors" }]
keywords = ["git", "visualization", "churn", "complexity", "codebase", "tui", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "rich>=13.0.0",
    "textual>=0.60.0",
]

[project.optional-dependencies]
ai = ["openai>=1.0.0"]
dev = ["pytest>=8.0.0", "openai>=1.0.0"]

[project.scripts]
gitlore = "gitlore.cli:main"

[project.urls]
Homepage = "https://github.com/LucasYanzy/gitlore"
Repository = "https://github.com/LucasYanzy/gitlore"
Documentation = "https://github.com/LucasYanzy/gitlore#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/gitlore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
